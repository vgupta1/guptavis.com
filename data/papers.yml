  abstract: 'In the age of big data analytics, it is increasingly important for researchers and practitioners
    to be familiar with methods and software tools for analyzing large data sets, formulating and
    solving large-scale mathematical optimization models, and sharing solutions using interactive
    media. Unfortunately, advanced software tools are seldom included in curricula of graduate-level
    operations research (OR) programs. We describe a course consisting of eight three-hour modules
    intended to introduce Master’s and PhD students to advanced software tools for OR: Machine Learning
    in R, Data Wrangling, Visualization, Big Data, Algebraic Modeling with JuMP, High-Performance
    and Distributed Computing, Internet and Databases, and Advanced Mixed Integer Linear Programming
    (MILP) Techniques. For each module, we outline content, provide course materials, summarize student
    feedback, and share lessons learned from two iterations of the course. Student feedback was very
    positive, and all students reported that the course equipped them with software skills useful
    for their own research. We believe our course materials could serve as a template for the development
    of effective OR software tools courses and discuss how they could be adapted to other educational
    settings.'

  title: Efficient and Targeted COVID-19 Border Testing via Reinforcement Learning
  authors:
  - Hamsa Bastani
  - Kimon Drakopoulos
  - Jon Vlachogiannis
  - Christos Hadjichristodoulou
  - Pagona Lagiou

  title: 3D-Printing for Supply Chain Resilience
  authors:
  - Ziyu He
  - Nick Vyas
  venue: Under Review
  venue_raw: Under Review.
  year: null
  status: under_review
  primary: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5208801
  links:
    ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5208801
  local_pdf: null
  awards: []
  abstract: 'Problem definition: Most strategies for mitigating supply chain disruptions require
    upfront, dedicated investments for each supplier, making them impractical for large, disaggregated
    supply chains. We study using 3D printing (3DP) as a flexible, backup resource that can support
    any disrupted supplier. 3DP has traditionally been rejected as a viable resilience strategy due
    to high per-unit production costs and limited capacity. Inspired by the "a little flexibility
    is enough" literature, however, we explore when and why 3DP may be a cost-effective resilience
    strategy and how to deploy it. Methodology/Results: We formulate an optimization model to decide
    which suppliers to backup with 3DP, how much 3DP capacity to procure, and how to allocate that
    capacity in real-time to unmet demand. The resulting mixed-binary, stochastic optimization problem
    is computationally challenging, even for moderate sized supply chains. Hence, we propose a novel
    algorithmic framework combining supermodular approximations based on Taylor series and first-order
    stochastic optimization to compute high-quality feasible solutions. Finally, we conduct an empirical
    case study based on bill-of-lading data from toy manufacturer Mattel. With cost estimates based
    on current technology, 3DP offer modest cost savings relative to traditional resilience strategies.
    However, its principal benefit is a reduction in demand shortfalls. This advantage is especially
    evident in larger systems with weakly correlated supplier disruptions. Managerial implications:
    Resonating with the well-known "a little flexibility is enough" principle, our findings provide
    both analytical and empirical evidence of 3DP''s transformative potential as a strategic resilience
    tool for large supply chains. We also provide concrete guidance on how to introduce 3DP into
    an existing portfolio of supply chain resilience strategies to complement existing capabilities.'
  retired_local_pdf: 3DP_SupplyChainResilience.pdf

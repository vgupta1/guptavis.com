  venue_raw: NeurIPS 2024.
  year: 2024
  status: conference
  primary: https://proceedings.neurips.cc/paper_files/paper/2024/hash/907a9fb75a408f6c3a2ae1bf84c39e44-Abstract-Conference.html
  links:
    proceedings: https://proceedings.neurips.cc/paper_files/paper/2024/hash/907a9fb75a408f6c3a2ae1bf84c39e44-Abstract-Conference.html
    arxiv: https://arxiv.org/abs/2402.03256
  local_pdf: null
  awards: []
  abstract: We propose a novel family of decision-aware surrogate losses, called Perturbation Gradient
    (PG) losses, for the predict-then-optimize framework. The key idea is to connect the expected
    downstream decision loss with the directional derivative of a particular plug-in objective, and
    then approximate this derivative using zeroth order gradient techniques. Unlike the original
    decision loss which is typically piecewise constant and discontinuous, our new PG losses can
    be optimized using off-the-shelf gradient-based methods. Most importantly, unlike existing surrogate
    losses, the approximation error of our PG losses vanishes as the number of samples grows. Hence,
    optimizing our surrogate loss yields a best-in-class policy asymptotically, even in misspecified
    settings. This is the first such result in misspecified settings, and we provide numerical evidence
    confirming our PG losses substantively outperform existing proposals when the underlying model
    is misspecified.
  retired_local_pdf: PGLosses.pdf
- key: beyond_discretization_learning_the
  venue_short: "*AISTATS*"
  venue_group: "AISTATS"
  themes: ["Optimization proxies"]
  applications: []

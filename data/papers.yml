  title: Maximizing Intervention Effectiveness
  authors:
  - Brian Rongqing Han
  - Song-Hee Kim
  - Hyung Paek
  venue: Management Science
  venue_raw: Management Science (Published online May 2020) .
  year: 2020
  status: published
  primary: https://pubsonline.informs.org/doi/abs/10.1287/mnsc.2019.3537
  links:
    doi: https://pubsonline.informs.org/doi/abs/10.1287/mnsc.2019.3537
    ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3026913
  local_pdf: null
  awards:
  - Finalist in the 2018 Pierskalla Best Paper Competition (INFORMS Health Applications Society)
  - Finalist in the 2018 POMS College of Healthcare and Operations Management (CHOM) Best Paper Competition
  abstract: 'Frequently, policymakers seek to roll out an intervention previously proven effective
    in a research study, perhaps subject to resource constraints. However, since different subpopulations
    may respond differently to the same treatment, there is no a priori guarantee that the intervention
    will be as effective in the targeted population as it was in the study. How then should policymakers
    target individuals to maximize intervention effectiveness? We propose a novel robust optimization
    approach that leverages evidence typically available in a published study. Our approach is tractable
    – real-world instances are easily optimized in minutes with off-the-shelf software – and flexible
    enough to accommodate a variety of resource and fairness constraints. We compare our approach
    with current practice by proving performance guarantees for both approaches, which emphasize
    their structural differences. We also prove an intuitive interpretation of our model in terms
    of regularization, penalizing differences in the demographic distribution between targeted individuals
    and the study population. Although the precise penalty depends on the choice of uncertainty set,
    we show that for special cases we can recover classical penalties from the covariate matching
    literature on causal inference. Finally, using real data from a large teaching hospital, we compare
    our approach to common practice in the particular context of reducing emergency department utilization
    by Medicaid patients through case management. We find that our approach can offer significant
    benefits over common practice, particularly when the heterogeneity in patient response to the
    treatment is large. Popular News Coverage : USC Marshall News'
  retired_local_pdf: MaxIntEffective.pdf
- key: near_optimal_bayesian_ambiguity
  venue_short: "*Management Science*"
  venue_group: "Management Science"

  title: 'Beyond Discretization: Learning the Optimal Solution Path'
  authors:
  - Qiran Dong
  - Paul Grigas
  venue: AISTATS 2025
  venue_raw: 'Proceedings of the 28th International Conference on Artificial Intelligence and Statistics (AISTATS), PMLR 258, 2025.'
  year: 2025
  status: conference
  primary: https://proceedings.mlr.press/v258/dong25a.html
  links:
    proceedings: https://proceedings.mlr.press/v258/dong25a.html
    arxiv: https://arxiv.org/abs/2410.14885
  local_pdf: null
  awards: []
  abstract: 'Many applications require minimizing a family of optimization problems indexed by some
    hyperparameter λ∈Λ to obtain an entire solution path. Traditional approaches proceed by discretizing
    Λ and solving a series of optimization problems. We propose an alternative approach that parameterizes
    the solution path with a set of basis functions and solves a \emph{single} stochastic optimization
    problem to learn the entire solution path. Our method offers substantial complexity improvements
    over discretization. When using constant-step size SGD, the uniform error of our learned solution
    path relative to the true path exhibits linear convergence to a constant related to the expressiveness
    of the basis. When the true solution path lies in the span of the basis, this constant is zero.
    We also prove stronger results for special cases common in machine learning: When λ∈[−1,1] and
    the solution path is ν-times differentiable, constant step-size SGD learns a path with ϵ uniform
    error after at most O(ϵ11−νlog(1/ϵ)) iterations, and when the solution path is analytic, it only
    requires O(log2(1/ϵ)loglog(1/ϵ)). By comparison, the best-known discretization schemes in these
    settings require at least O(ϵ−1/2) discretization points (and even more gradient calls). Finally,
    we propose an adaptive variant of our method that sequentially adds basis functions and demonstrates
    strong numerical performance through experiments.'
  retired_local_pdf: LearningSolutionPath.pdf
- key: decision_aware_denoising
  venue_short: "*Management Science*"
  venue_group: "Management Science"
  themes: ["Decision-focused learning", "Small-data optimization", "Policy evaluation"]
  applications: []
  student_coauthors: ["Michael Huang"]
  selected: false
  title: Decision-Aware Denoising
  authors:
  - Michael Huang
  - Paat Rusmevichientong
  venue: Management Science
  venue_raw: Management Science (to appear)
  year: null
  status: accepted
  primary: https://dx.doi.org/10.2139/ssrn.4714305
  links:
    doi: https://dx.doi.org/10.2139/ssrn.4714305
  local_pdf: null
  awards: []
  abstract: 'Modern decision-making in urban planning, climate change, and healthcare leverages large
    geospatial and panel datasets. These data are often extremely noisy, resulting in low-quality
    downstream decisions. We propose a new "light touch" framework to adapt machine learning techniques
    originally designed for denoising by smoothing to guide decision-making. The cornerstone of our
    method is a novel estimator of out-of-sample policy performance named the one-shot Variance Gradient
    Correction (one-shot VGC). By applying the one-shot VGC, we adjust machine learning methods to
    minimize downstream costs rather than minimizing prediction error or maximizing signal recovery.
    We uniformly bound the relative error of the one-shot VGC as an estimate of downstream costs
    by an intuitive measure of solution stability for the problem, plus a term that vanishes as problem
    dimension increases. Solution stability depends on both the policy and the structure of the downstream
    optimization problem. We establish bounds for solution stability across three classes of policies
    and problems: i) regularized plug-in policies for convex feasible regions, ii) unregularized
    plug-in policies for strongly-convex feasible regions, and iii) unregularized affine plug-in
    policies for weakly-coupled (potentially non-convex) problems. In all scenarios, we demonstrate
    that solution stability diminishes (relative to out-of-sample cost) as the dimension of the optimization
    problem increases. Finally, we present a case study using real traffic accident data from New
    York City, deploying speed humps to reduce pedestrian injuries. Our "light-touch" decision-aware
    approach surpasses traditional decision-blind techniques, underscoring that optimal smoothing
    levels for a denoising algorithm should depend on the downstream decision problem.'
  retired_local_pdf: DecisionAwareDenoising.pdf

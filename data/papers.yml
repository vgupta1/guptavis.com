  local_pdf: null
  awards:
  - Finalist in the 2018 INFORMS Service Science Best Paper Competition
  notes:
  - Accepted in The 15th Conference on Web and Internet Economics (WINE), 2019
  abstract: Increased availability of high-quality customer information has fueled interest in personalized
    pricing strategies, i.e., strategies that predict an individual customer’s valuation for a product
    and then o↵er a price tailored to that customer. While the appeal of personalized pricing is
    clear, it may also incur large costs in the form of market research, investment in information
    technology and analytics expertise, and branding risks. In light of these trade-offs, our work
    studies the value of personalized pricing strategies over a simple single price strategy. We
    first provide closed-form lower and upper bounds on the ratio between the profits of an idealized
    personalized pricing strategy (first-degree price discrimination) and a single price strategy.
    Our bounds depend on simple statistics of the valuation distribution and shed light on the types
    of markets for which personalized pricing has little or significant potential value. Second,
    we consider a feature-based pricing model where customer valuations can be estimated from observed
    features. We show how to transform our aforementioned bounds into lower and upper bounds on the
    value of feature-based pricing over single pricing depending on the degree to which the features
    are informative for the valuation. Finally, we demonstrate how to obtain sharper bounds by incorporating
    additional information about the valuation distribution (moments or shape constraints) by solving
    tractable linear optimization problems.

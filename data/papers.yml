- key: debiasing_in_sample_policy
  venue_short: "*Operations Research*"
  venue_group: "Operations Research"
  themes: ["Small-data optimization", "Policy evaluation"]
  applications: []
  student_coauthors: ["Michael Huang"]
  selected: true
  title: Debiasing In-Sample Policy Performance for Small-Data, Large-Scale Optimization
  authors:
  - Michael Huang
  - Paat Rusmevichientong
  venue: Operations Research
  venue_raw: Operations Research 72(2):848-870 (online Nov. 2022).
  year: 2024
  status: published
  primary: https://doi.org/10.1287/opre.2022.2377
  links:
    doi: https://doi.org/10.1287/opre.2022.2377
    ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3858984
    arxiv: https://arxiv.org/abs/2107.12438
  local_pdf: null
  awards: []
  abstract: Motivated by the poor performance of cross-validation in settings where data are scarce,
    we propose a novel estimator of the out-of-sample performance of a policy in data-driven optimization.
    Our approach exploits the optimization problem’s sensitivity analysis to estimate the gradient
    of the optimal objective value with respect to the amount of noise in the data and uses the estimated
    gradient to debias the policy’s in-sample performance. Importantly, unlike cross-validation techniques,
    our approach avoids sacrificing data for a test set, utilizes all data when training and, hence,
    is well-suited to settings where data are scarce. We prove bounds on the bias and variance of
    our estimator for optimization problems with uncertain objectives but known, potentially non-convex,
    feasible regions. For more specialized optimization problems where the feasible region is “weakly-coupled”
    in a certain sense, we prove stronger results. Specifically, we provide explicit high-probability
    bounds on the error of our estimator that holds uniformly over a policy class and depends on
    the problem’s dimension and policy class’s complexity. Importantly, all of our bounds show that
    under mild conditions, the error of our estimator vanishes as the dimension of the optimization
    problem grows, even if the amount of available data remains small and constant. Said differently,
    we prove our estimator performs well in the small-data, large-scale regime. Finally, we numerically
    compare our proposed method to state-of-the-art approaches through a case-study on dispatching
    emergency medical response services using real data. Our method provides more accurate estimates
    of out-of-sample performance and learns better-performing policies.
  retired_local_pdf: Debiasing.pdf   # server has the capitalized name; the old
  # site linked lowercase "debiasing.pdf", which was a 404 on a case-sensitive server

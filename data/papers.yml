  abstract: "For my course “AI: Perils, Pitfalls, and Promise,” I developed a chatbot that emulates the Socratic method for exploring ethical challenges around AI (nicknamed “Chatocrates” for “chatting with Socrates”). Students chat with Chatocrates individually about an instructor-chosen prompt, and Chatocrates pushes students to articulate their values and opinions around the prompt. Through repeated interrogation, Chatocrates helps students self-identify inconsistencies in their reasoning and introspect their own values, priming them for class discussion and written assignments. This article discusses how and why chatbots are uniquely suited to the Socratic method in this context, the value of such chatbots in developing critical thinking, and continued challenges and opportunities."
